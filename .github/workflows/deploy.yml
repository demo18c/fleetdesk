# Continuous deployment: every push to main builds the project (as a sanity check)
# and then SSHes into the EC2 instance to pull, rebuild, and restart the app.
name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy over SSH
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy script on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: bash /home/ubuntu/fleetdesk/deploy/deploy.sh
